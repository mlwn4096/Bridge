<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Bridge — Your devices, on speaking terms.</title>
<desc id="desc">A Mac and Android phone connected directly. Files, clipboard, notifications. Local connection, no account, no cloud relay.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2a"/><stop offset="1" stop-color="#080e17"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#277ca3" stop-opacity=".3"/><stop offset="1" stop-color="#277ca3" stop-opacity="0"/></radialGradient>
<linearGradient id="line"><stop stop-color="#68a8ff"/><stop offset="1" stop-color="#78e7c4"/></linearGradient>
</defs>
<rect width="1280" height="520" rx="24" fill="url(#bg)"/>
<ellipse cx="1010" cy="240" rx="390" ry="330" fill="url(#glow)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="64" y="75" font-size="14" letter-spacing="4" fill="#7ce5c6">MAC + ANDROID. TOGETHER.</text>
<text x="60" y="170" font-size="80" font-weight="700" letter-spacing="-4" fill="#f1f6ff">Bridge</text>
<text x="64" y="229" font-size="30" font-weight="600" fill="#f1f6ff">Your devices,</text>
<text x="64" y="269" font-size="30" font-weight="600" fill="#f1f6ff">on speaking terms.</text>
<text x="64" y="322" font-size="18" fill="#a8bbd1">Files. Clipboard. Notifications.</text>
<text x="64" y="350" font-size="18" fill="#a8bbd1">A little less friction between screens.</text>
<rect x="64" y="414" width="336" height="40" rx="20" fill="#142c32" stroke="#28544e"/>
<circle cx="85" cy="434" r="4" fill="#7ce5c6"/>
<text x="100" y="440" font-size="14" fill="#b8e8dc">Local connection · No account · No relay</text>
<g fill="#101e30" stroke="#45617d" stroke-width="2">
